<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Likeflow · 让喜欢发生</title>
<style>
:root{--ink:#172c29;--muted:#73827d;--line:#dce4de;--green:#207359;--paper:#f6f8f3;--pink:#c95765}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,select{font:inherit}button{cursor:pointer}header{border-bottom:1px solid var(--line)}.nav{max-width:1120px;margin:auto;padding:23px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:25px;font-weight:750;letter-spacing:-1px;display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:var(--green);color:white;font-size:22px}.nav small{color:var(--muted);font-size:12px;letter-spacing:1px}.user{display:flex;gap:12px;align-items:center}.avatar{border-radius:50%;background:#dce9dc;width:34px;height:34px;display:grid;place-items:center;color:var(--green);font-weight:700}select{border:0;background:transparent;color:var(--ink);padding:8px;max-width:180px}main{max-width:1120px;margin:auto;padding:54px 28px 30px}.eyebrow{color:var(--green);font-size:12px;font-weight:700;letter-spacing:2px;display:flex;align-items:center;gap:8px}.dot{width:6px;height:6px;border-radius:50%;background:var(--green)}h1{font-size:clamp(32px,5vw,48px);letter-spacing:-1.5px;line-height:1.35;margin:16px 0}h1 span{font-family:Georgia,serif;font-weight:400;font-style:italic;color:var(--green)}.intro{color:var(--muted);margin:0;max-width:620px;font-size:15px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:40px 0 20px;gap:16px}.section-title{font-weight:650}.section-title span{color:var(--muted);font-size:12px;margin-left:12px;font-weight:400}.refresh{background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);padding:7px 13px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #1f46300a}.art{height:167px;position:relative;overflow:hidden;background:#e4eee2;display:flex;align-items:center;justify-content:center}.art:after{content:'';position:absolute;inset:12px;border:1px solid #ffffff65;border-radius:9px}.art.one .shape{width:85px;height:85px;background:#47866e;border-radius:26px;transform:rotate(-22deg);box-shadow:32px 18px 0 #b5ceb9,-30px -18px 0 #d0dfc8}.art.two{background:#f1e8da}.art.two .shape{width:96px;height:96px;border:23px solid #c8a47c;border-radius:50%;box-shadow:45px 0 0 -8px #e1ceaf;transform:translateX(-15px)}.art.three{background:#e4e9f1}.art.three .shape{width:112px;height:22px;background:#768ca5;transform:rotate(-28deg);box-shadow:0 31px 0 #a4b4c7,0 -31px 0 #c4cfdf}.art-label{position:absolute;bottom:16px;left:20px;z-index:1;font-size:10px;letter-spacing:2px;color:#435a4e}.content{padding:24px 24px 20px;display:flex;flex-direction:column;flex:1}.category{color:var(--green);font-size:11px;font-weight:600;letter-spacing:1px}h2{font-size:20px;line-height:1.55;letter-spacing:-.5px;margin:10px 0 12px}.summary{color:var(--muted);font-size:13px;margin:0 0 24px;flex:1}.actions{border-top:1px solid #edf0eb;padding-top:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}.like{border:1px solid var(--line);border-radius:24px;padding:7px 14px;background:white;display:flex;align-items:center;gap:9px;color:var(--muted);transition:.2s;min-width:92px;justify-content:center}.like.active{color:var(--pink);background:#fff1f2;border-color:#f1d1d5}.like svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7}.like.active svg{fill:currentColor}.like:disabled{cursor:wait;opacity:.5}.like:focus-visible,.refresh:focus-visible,select:focus-visible{outline:3px solid #84bda5;outline-offset:3px}.status{font-size:11px;color:var(--muted)}.persist{margin-top:14px;font:10px/1.8 ui-monospace,monospace;color:#8a9891}.persist.pending{color:#aa7d29}.persist.error{color:#b84949}.note{display:flex;gap:14px;margin-top:30px;padding:20px 23px;border:1px solid var(--line);border-radius:12px;background:#edf3eb;font-size:12px;color:#647c6e}.note strong{display:block;color:var(--ink);margin-bottom:3px;font-weight:600}.note-icon{font-size:20px;color:var(--green)}footer{display:flex;justify-content:space-between;color:#92a097;font-size:11px;margin-top:32px;border-top:1px solid var(--line);padding-top:18px;gap:20px}.activity{margin-top:28px}.activity summary{font-size:12px;color:var(--muted);cursor:pointer}.log{font:11px/1.8 ui-monospace,monospace;padding:12px 0;max-height:150px;overflow:auto;color:#65796c}.banner{margin-bottom:22px;padding:12px 16px;background:#fff1df;border:1px solid #e8cc9e;border-radius:9px;font-size:13px}.banner[hidden]{display:none}@media(max-width:850px){.grid{grid-template-columns:1fr}.card{display:grid;grid-template-columns:180px 1fr}.art{height:100%;min-height:220px}.nav small{display:none}main{padding-top:36px}.content{padding:20px}.note{margin-top:22px}}@media(max-width:520px){.card{display:flex}.art{min-height:0;height:140px}.nav,main{padding-left:20px;padding-right:20px}.brand{font-size:22px}.avatar{display:none}.toolbar .section-title span{display:none}footer{flex-direction:column;gap:5px}h1{letter-spacing:-1px}.user{gap:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="nav"><div class="brand"><span class="mark">↗</span>likeflow <small> / 互动实验室</small></div><div class="user"><span class="avatar" id="avatar">林</span><select id="user" aria-label="选择测试用户"><option value="1001">林一 · 用户 1001</option><option value="1002">陈末 · 用户 1002</option><option value="1003">小夏 · 用户 1003</option></select></div></div></header>
<main>
<div class="eyebrow"><span class="dot"></span> A LITTLE LIKE, A REAL CONNECTION</div>
<h1>让每一份喜欢，<span>都有回应。</span></h1>
<p class="intro">读一段故事，留下你的喜欢。切换不同的身份，感受每一次点击带来的变化。</p>
<div class="toolbar"><div class="section-title">值得一读 <span>精选文章 / 实时互动</span></div><button class="refresh" id="refresh">↻ 刷新状态</button></div>
<div id="banner" class="banner" role="alert" hidden></div>
<div class="grid" id="cards" aria-live="polite"></div>
<div class="note"><span class="note-icon">◎</span><div><strong>一个小小的点赞，一条完整的数据旅程。</strong>点击爱心即可点赞，再次点击取消。每个用户的状态独立保存；下方同步信息展示最终落库进度。网络异常时请先刷新状态，操作结果可能仍在处理中。</div></div>
<details class="activity"><summary>查看交互记录</summary><div class="log" id="log" aria-live="polite">等待第一次互动…</div></details>
<footer><span>LIKEFLOW · 为每一次互动，提供可靠回应</span><span>Gin / Redis / RocketMQ / MySQL</span></footer>
</main>
<script>
const $=id=>document.getElementById(id);let targets=[],states=new Map(),busy=new Set(),epoch=0,loading=false,logged=false;const uncertain=new Set();
const heart='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>';
function banner(text=''){$('banner').textContent=text;$('banner').hidden=!text}
function log(text){const row=document.createElement('div');row.textContent=new Date().toLocaleTimeString()+'  '+text;$('log').prepend(row);while($('log').children.length>40)$('log').lastChild.remove()}
async function api(path,options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{const response=await fetch('/api/v1'+path,{...options,headers:{'Content-Type':'application/json',...options.headers},signal:controller.signal});const data=await response.json();if(!response.ok)throw new Error(data.error||'请求失败');return data}finally{clearTimeout(timer)}}
function key(t){return t.type+':'+t.id}function path(t,suffix='like'){return '/targets/'+t.type+'/'+t.id+'/'+suffix}
function render(){const grid=$('cards');grid.replaceChildren();targets.forEach((t,i)=>{const article=document.createElement('article');article.className='card';article.innerHTML='<div class="art '+['one','two','three'][i%3]+'"><div class="shape"></div><span class="art-label">FIELD NOTES / 0'+(i+1)+'</span></div><div class="content"><span class="category"></span><h2></h2><p class="summary"></p><div class="actions"><button class="like" disabled>'+heart+'<span>—</span></button><span class="status">读取状态中</span></div><div class="persist">等待连接…</div></div>';article.querySelector('.category').textContent=t.category;article.querySelector('h2').textContent=t.title;article.querySelector('.summary').textContent=t.summary;article.id='t-'+key(t);article.querySelector('button').onclick=()=>change(t);grid.append(article)})}
function update(t){const s=states.get(key(t)),node=$('t-'+key(t));if(!node)return;const button=node.querySelector('button');button.disabled=loading||busy.has(key(t))||!s;button.classList.toggle('active',!!s?.liked);button.setAttribute('aria-pressed',String(!!s?.liked));button.setAttribute('aria-label',s?.liked?'取消点赞':'点赞');button.querySelector('span').textContent=s?.count??'—';node.querySelector('.status').textContent=busy.has(key(t))?'正在提交…':uncertain.has(key(t))?'结果未知 · 请刷新':s?.liked?'你已喜欢这篇文章':s?'喜欢就点个赞':'状态暂不可用'}
async function read(t,e){try{const s=await api(path(t));if(e!==epoch)return;states.set(key(t),s);update(t)}catch(err){if(e!==epoch)return;states.delete(key(t));update(t);throw err}}
async function sync(t,e){try{const db=await api(path(t,'sync'));if(e!==epoch)return;const s=states.get(key(t)),node=$('t-'+key(t));const ok=s&&db.version===s.version&&db.liked===s.liked&&db.count===s.count;node.querySelector('.persist').textContent=ok?'● 已同步 · v'+db.version+' · '+db.count+' 次喜欢':'◌ 同步中 · 在线 v'+(s?.version??'—')+' / 落库 v'+db.version+' · DB '+db.count;node.querySelector('.persist').className='persist'+(ok?'':' pending')}catch(err){if(e!==epoch)return;const p=$('t-'+key(t))?.querySelector('.persist');if(p){p.textContent='同步状态暂不可用';p.className='persist error'}}}
async function refresh(){if(loading||busy.size)return;loading=true;$('refresh').disabled=true;targets.forEach(update);const e=epoch;try{await Promise.all(targets.map(t=>read(t,e)));banner();await Promise.all(targets.map(t=>sync(t,e)))}catch(err){banner(err.message)}finally{loading=false;$('refresh').disabled=false;targets.forEach(update)}}
async function change(t){const k=key(t);if(loading||busy.has(k)||!states.has(k))return;const e=epoch,action=states.get(k).liked?'UNLIKE':'LIKE';busy.add(k);$('user').disabled=true;update(t);try{const s=await api(path(t),{method:'PUT',body:JSON.stringify({action})});if(e!==epoch)return;states.set(k,s);uncertain.delete(k);banner();log(t.id+' '+action+' → '+s.code+' · changed='+s.changed+' · v'+s.version);await sync(t,e)}catch(err){uncertain.add(k);banner(err.message+'。请求结果可能未知，请先刷新状态。');log(t.id+' 操作结果未知：'+err.message);try{await read(t,e);await sync(t,e)}catch{}}finally{busy.delete(k);$('user').disabled=false;update(t)}}
async function login(){if(busy.size||loading)return;loading=true;$('user').disabled=true;$('refresh').disabled=true;const e=++epoch;states.clear();uncertain.clear();targets.forEach(update);try{await api('/session',{method:'POST',body:JSON.stringify({user_id:$('user').value})});logged=true;$('avatar').textContent={1001:'林',1002:'陈',1003:'夏'}[$('user').value];log('已切换用户 '+$('user').value);await Promise.all(targets.map(t=>read(t,e)));await Promise.all(targets.map(t=>sync(t,e)));banner()}catch(err){logged=false;banner(err.message)}finally{loading=false;$('user').disabled=false;$('refresh').disabled=false;targets.forEach(update)}}
$('user').onchange=login;$('refresh').onclick=()=>logged?refresh():login();
(async()=>{try{const data=await api('/targets');targets=data.targets;render();if(data.demo_mode)await login();else{$('user').disabled=true;logged=true;await refresh();banner('测试登录未启用，请通过已接入的登录凭证访问。')}}catch(err){banner('连接失败：'+err.message)}})();
setInterval(()=>{if(logged&&!loading&&!busy.size){const e=epoch;targets.forEach(t=>sync(t,e))}},3000);
</script>
</body></html>
